name: CMake and GoogleTest

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run CI script on Unix
        if: runner.os != 'Windows'
        run: sh ci.sh

      - name: Run CI script on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call ci.bat
